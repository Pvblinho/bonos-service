apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  namespace: default
  labels:
    app: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
      - name: bonos-service
        image: 090493510825.dkr.ecr.us-east-1.amazonaws.com/bonos-service:latest
        ports:
        - containerPort: 8004
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: casino-secrets
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: casino-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: casino-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: casino-secrets
              key: DB_NAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: casino-secrets
              key: JWT_SECRET
        - name: DB_PORT
          value: "5432"
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: 300m
        livenessProbe:
          httpGet:
            path: /livez
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bonos-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: bonos-service
  ports:
  - protocol: TCP
    port: 8004
    targetPort: 8004
